name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saudi-shield/core build
      - run: pnpm --filter @saudi-shield/core test
      - run: pnpm --filter @saudi-shield/api test
      - run: pnpm --filter @saudi-shield/dashboard typecheck
      - run: pnpm --filter @saudi-shield/mobile typecheck
      - run: pnpm --filter @saudi-shield/dashboard build
